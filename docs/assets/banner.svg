<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Note Again</title>
  <desc id="desc">Note Again for Obsidian. Five stars represent the default daily note goal.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#19152c"/>
      <stop offset="1" stop-color="#2b2049"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b298ff"/>
      <stop offset="1" stop-color="#8258eb"/>
    </linearGradient>
    <path id="star" d="M0-15 4-4 15 0 4 4 0 15-4 4-15 0-4-4Z" fill="#fff"/>
  </defs>
  <rect width="1200" height="240" rx="24" fill="url(#background)"/>
  <text x="64" y="124" fill="#faf8ff" font-family="Segoe UI,Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-3">Note Again</text>
  <text x="68" y="163" fill="#d1c7e7" font-family="Segoe UI,Arial,sans-serif" font-size="25">Obsidian plugin</text>
  <g transform="translate(737 87)">
    <rect width="66" height="66" rx="17" fill="url(#tile)"/>
    <use href="#star" x="33" y="33"/>
    <rect x="78" width="66" height="66" rx="17" fill="url(#tile)"/>
    <use href="#star" x="111" y="33"/>
    <rect x="156" width="66" height="66" rx="17" fill="url(#tile)"/>
    <use href="#star" x="189" y="33"/>
    <rect x="234" width="66" height="66" rx="17" fill="url(#tile)"/>
    <use href="#star" x="267" y="33"/>
    <rect x="312" width="66" height="66" rx="17" fill="url(#tile)"/>
    <use href="#star" x="345" y="33"/>
  </g>
</svg>
